name: ryden-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ryden}
      POSTGRES_USER: ${POSTGRES_USER:-ryden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ryden} -d ${POSTGRES_DB:-ryden}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    shm_size: 128mb
    mem_limit: ${RYDEN_POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${RYDEN_POSTGRES_CPUS:-1.5}
    pids_limit: 256
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    volumes:
      - ryden-postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      RYDEN_DATABASE_URL: ${RYDEN_DATABASE_URL:?set RYDEN_DATABASE_URL}
      RYDEN_ACCESS_TOKEN_SECRET: ${RYDEN_ACCESS_TOKEN_SECRET:?set RYDEN_ACCESS_TOKEN_SECRET}
      RYDEN_HTTP_ADDR: :8080
      RYDEN_ALLOWED_ORIGIN: ${RYDEN_ALLOWED_ORIGIN:?set RYDEN_ALLOWED_ORIGIN}
      RYDEN_COOKIE_SECURE: "true"
      RYDEN_DATABASE_MAX_CONNS: ${RYDEN_DATABASE_MAX_CONNS:-10}
      RYDEN_DATABASE_MIN_CONNS: ${RYDEN_DATABASE_MIN_CONNS:-1}
      RYDEN_DATABASE_CONNECT_TIMEOUT: ${RYDEN_DATABASE_CONNECT_TIMEOUT:-5s}
      RYDEN_DATABASE_STATEMENT_TIMEOUT: ${RYDEN_DATABASE_STATEMENT_TIMEOUT:-8s}
      RYDEN_DATABASE_MAX_CONN_LIFETIME: ${RYDEN_DATABASE_MAX_CONN_LIFETIME:-30m}
      RYDEN_DATABASE_MAX_CONN_IDLE_TIME: ${RYDEN_DATABASE_MAX_CONN_IDLE_TIME:-5m}
      RYDEN_DATABASE_HEALTH_CHECK_PERIOD: ${RYDEN_DATABASE_HEALTH_CHECK_PERIOD:-1m}
      RYDEN_LIVE_POLL_INTERVAL: ${RYDEN_LIVE_POLL_INTERVAL:-2s}
      RYDEN_LIVE_POLL_TIMEOUT: ${RYDEN_LIVE_POLL_TIMEOUT:-1500ms}
      RYDEN_LIVE_MAX_MEETINGS: ${RYDEN_LIVE_MAX_MEETINGS:-1000}
      RYDEN_LIVE_MAX_SUBSCRIBERS_PER_MEETING: ${RYDEN_LIVE_MAX_SUBSCRIBERS_PER_MEETING:-100}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/ryden", "healthcheck", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: ${RYDEN_API_MEMORY_LIMIT:-384m}
    cpus: ${RYDEN_API_CPUS:-1.0}
    pids_limit: 256
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "${RYDEN_WEB_BIND:-127.0.0.1}:${RYDEN_WEB_PORT:-8080}:80"
    mem_limit: ${RYDEN_WEB_MEMORY_LIMIT:-128m}
    cpus: ${RYDEN_WEB_CPUS:-0.5}
    pids_limit: 128
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  ryden-postgres:
