services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ryden
      POSTGRES_USER: ryden
      POSTGRES_PASSWORD: ryden
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryden -d ryden"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ryden-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RYDEN_DATABASE_URL: postgres://ryden:ryden@postgres:5432/ryden?sslmode=disable
      RYDEN_ACCESS_TOKEN_SECRET: ${RYDEN_ACCESS_TOKEN_SECRET:-local-development-secret-change-me}
      RYDEN_HTTP_ADDR: :8080
      RYDEN_ALLOWED_ORIGIN: http://localhost:5173
      RYDEN_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/ryden", "healthcheck", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  ryden-postgres:
